name: biolm/library-screen-v1
schema_version: 1
protocol_version: "1.0.0"
description: >
  Fold-first multi-property library screen: predict structures with ESMFold,
  then score thermal stability. Downstream tools filter on pLDDT / Tm.

about:
  title: Multi-property library screen
  description: ESMFold confidence gate plus stability scoring.
  keywords: [screen, esmfold, stability, fold-first]

example_inputs:
  sequences:
    - MKTAYIAKQRQISFVKSHFSRQLEERLGLIEVQ
    - MENDELGGGGSKTAYIAKQRQISFVKSHFSRQL

inputs:
  sequences:
    type: list_of_str
    label: Candidate sequences
    required: true
    initial: []

tasks:
  - id: fold
    slug: esmfold
    action: predict
    request_body:
      items: ${{ sequences }}
    response_mapping:
      pdb: pdb
      mean_plddt: mean_plddt

  - id: stability
    slug: temberture-regression
    action: predict
    depends_on:
      - fold
    request_body:
      items: ${{ sequences }}
    response_mapping:
      tm: prediction
